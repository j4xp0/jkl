name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: validate the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: [^A-Z[:space:]].+$'
          if ! printf '%s' "$TITLE" | grep -Eq "$PATTERN"; then
            echo "::error::pull request title does not follow the commit convention"
            exit 1
          fi
          if [ ${#TITLE} -gt 72 ]; then
            echo "::error::pull request title is longer than 72 characters"
            exit 1
          fi
          echo "title looks good"
